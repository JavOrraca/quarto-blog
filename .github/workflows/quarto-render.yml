# Render the Quarto site on PRs and on pushes to main.
#
# Why Quarto-only (no R):
#   posts/_metadata.yml sets freeze: true, and _freeze/ is committed.
#   A project-wide `quarto render` reuses those frozen computations and
#   does not re-execute knitr/R/Python. New executable posts still need a
#   local `quarto render <file>` so _freeze/ is updated before CI.
#
# Deploy: this workflow does not publish to Netlify. The live site is still
# git-backed and serves the committed _site/ directory. Do not gitignore or
# delete _site/ until Netlify is rewired (see the PR that added this file).

name: Quarto Render

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quarto-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2.2.0
        with:
          version: 1.10.18

      - name: Confirm Quarto version
        run: |
          quarto --version
          test "$(quarto --version)" = "1.10.18"

      - name: Render site
        run: quarto render

      - name: Confirm freeze was reused
        run: |
          if ! git diff --quiet -- _freeze; then
            echo "::error::_freeze/ changed during project render; freeze: true should reuse committed computations."
            git status --short -- _freeze
            git diff --stat -- _freeze
            exit 1
          fi

      - name: Check render output
        run: |
          test -f _site/index.html
          grep -q 'quarto-1.10.18' _site/index.html

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 7
