# Render the Quarto site on PRs and on pushes to main; publish to Netlify from main.
#
# Freeze: posts/_metadata.yml has freeze: auto and _freeze/ is committed, so a
# project-wide `quarto render` reuses frozen computations unless source changed.
# Drafts inherit freeze: auto (do not set freeze: false just because a post is
# a draft). freeze only controls knitr execution, not whether HTML is emitted.
# R 4.6.1 + renv.lock (r-lib/actions/setup-renv) restore knitr when freeze is
# missing or stale.
#
# Drafts: website.draft-mode is unlinked in _quarto.yml. Quarto 1.10 still
# writes full HTML plus the Draft banner for draft: true posts; they stay out
# of listings/search/sitemap. After render, scripts/check-draft-posts.py
# verifies Draft-banner HTML in the rendered `_site` (not git-tracked HTML).
#
# Deploy: `_site/` is gitignored. GitHub Actions publishes to Netlify on push
# to main and workflow_dispatch (from main) via quarto-dev/quarto-actions/publish@v2
# with render: false, so inject-og-meta.py (project.post-render) and the draft
# checks apply to the `_site` that gets published. PRs render, check, and
# upload a `_site` artifact; they do not publish.

name: Quarto Render and Publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quarto-render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Self-test draft post checker
        run: python3 scripts/check-draft-posts.py --self-test

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Confirm Quarto version
        run: |
          quarto --version
          test "$(quarto --version)" = "1.10.18"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsodium-dev

      - name: Install R dependencies from renv.lock
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render site
        run: quarto render

      - name: Note freeze status
        run: |
          if git diff --quiet -- _freeze; then
            echo "Freeze reused; _freeze/ unchanged."
          else
            echo "Freeze updated during render (missing freeze or a chunk executed)."
            git status --short -- _freeze
            git diff --stat -- _freeze
          fi

      - name: Check render output
        run: |
          test -f _site/index.html
          grep -q 'quarto-1.10.18' _site/index.html

      # Unlinked drafts must render with the Draft banner and stay off the Blog
      # listing. `_site/` is not git-tracked; CI publishes the rendered output.
      - name: Check draft posts are rendered and unlinked
        run: python3 scripts/check-draft-posts.py

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 7

      # quarto-actions/publish@v2 with render != true runs
      # `quarto publish netlify --no-render --no-browser`, so this uploads the
      # `_site` we just rendered (OG post-render + draft checks included).
      - name: Publish to Netlify
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: netlify
          render: false
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
